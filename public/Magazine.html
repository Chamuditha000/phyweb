<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Flipbook (Lazy, file:// friendly)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    html, body { margin:0; padding:0; height:100%; background:black; overflow:hidden; }
    .book { width:100%; height:100dvh; display:flex; align-items:center; justify-content:center; position:relative; }
    canvas { width:45vw; height:auto; margin:0 5px; box-shadow:0 0 10px #444; background:#000; }
    .nav-buttons { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 1000; }
    .nav-buttons button { min-width:44px; min-height:44px; padding:10px 20px; font-size:1rem; margin:0 10px; cursor:pointer; }
    .file-hint { position: fixed; top:12px; left:12px; z-index:1100; color:#0ff; background: rgba(0,0,0,0.6); padding:10px 12px; border-radius:8px; box-shadow:0 0 12px #0ff5; }
    .file-hint input { display:block; margin-top:8px; }
  </style>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Worker from CDN; disable worker on file:// for reliability
    const IS_FILE = location.protocol === "file:";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const DISABLE_WORKER = IS_FILE;
  </script>
</head>
<body>
  <div class="book">
    <canvas id="leftPage"></canvas>
    <canvas id="rightPage"></canvas>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn">⏪ Previous</button>
    <button id="nextBtn">Next ⏩</button>
  </div>

  <!-- file:// fallback UI -->
  <div id="fileHint" class="file-hint" style="display:none">
    <div><strong>Local mode:</strong> pick your <code>part01.pdf … part39.pdf</code> from the <code>pdfs/</code> folder.</div>
    <input id="pdfPicker" type="file" accept="application/pdf" multiple />
    <div id="pickStatus" style="margin-top:6px; opacity:0.8"></div>
  </div>

  <script>
    // ---------- Tunables ----------
    const MAX_DPR      = 1.4;
    const BASE_SCALE   = 1.15;
    const MAX_CANVAS_W = 2200;
    const MAX_CANVAS_H = 3000;
    const CACHE_KEEP   = 2;

    // Expected file names (order matters)
    const names = Array.from({length:39}, (_,i)=>`part${String(i+1).padStart(2,'0')}.pdf`);

    // Build default URLs
    let urls;
    if (IS_FILE) {
      // ✅ Pin to your commit for stability:
      const CDN_BASE = "https://cdn.jsdelivr.net/gh/Chamuditha000/phyweb@9a2f46b27c23a4f6726cc8de72e7ea5975b248d8/public/pdfs/";
      // (If you want latest main instead: remove the @commit — less stable caching)
      urls = names.map(n => CDN_BASE + n);
    } else {
      // http(s) hosting → use local files
      const base = document.baseURI;
      urls = names.map(n => new URL(`./pdfs/${n}`, base).toString());
    }

    // Caches
    const cache = new Map(); // partIndex -> { pdf, numPages, lastUsedTick }
    const endAt = new Map(); // partIndex -> cumulative last virtual page number
    let tick = 0;

    let currentPage = 1;
    let isBusy = false;

    const leftCanvas  = document.getElementById("leftPage");
    const rightCanvas = document.getElementById("rightPage");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    // ---------- file:// picker fallback if CDN fails ----------
    async function setupFileModeIfNeeded() {
      if (!IS_FILE) return true;
      try {
        // Probe first CDN PDF fast
        await pdfjsLib.getDocument({ url: urls[0], disableWorker: DISABLE_WORKER }).promise;
        return true;
      } catch (e) {
        // CDN blocked/offline → show picker
        const hint = document.getElementById('fileHint');
        const picker = document.getElementById('pdfPicker');
        const status = document.getElementById('pickStatus');
        hint.style.display = '';
        return new Promise(resolve => {
          picker.onchange = () => {
            const files = Array.from(picker.files || []);
            const byName = new Map(files.map(f => [f.name.toLowerCase(), f]));
            const blobUrls = names.map(name => {
              const f = byName.get(name.toLowerCase());
              return f ? URL.createObjectURL(f) : undefined;
            });
            if (!blobUrls[0]) { status.textContent = "part01.pdf is required."; return; }
            urls = blobUrls;
            status.textContent = `Loaded ${blobUrls.filter(Boolean).length} / ${names.length} parts.`;
            resolve(true);
          };
        });
      }
    }

    // --- Loading / rendering
    async function loadPart(partIndex) {
      if (cache.has(partIndex)) {
        const entry = cache.get(partIndex);
        entry.lastUsedTick = ++tick;
        return entry;
      }
      const url = urls[partIndex];
      if (!url) throw new Error(`Missing URL for part ${partIndex}`);
      const pdf = await pdfjsLib.getDocument({ url, disableWorker: DISABLE_WORKER }).promise;
      const numPages = pdf.numPages;
      const entry = { pdf, numPages, lastUsedTick: ++tick };
      cache.set(partIndex, entry);

      const prevEnd = partIndex === 0 ? 0 : (endAt.get(partIndex - 1) ?? 0);
      endAt.set(partIndex, prevEnd + numPages);

      pruneCache();
      return entry;
    }

    function pruneCache() {
      if (cache.size <= CACHE_KEEP) return;
      const entries = Array.from(cache.entries())
        .sort((a, b) => a[1].lastUsedTick - b[1].lastUsedTick);
      while (entries.length > CACHE_KEEP) {
        const [idx, entry] = entries.shift();
        try { entry.pdf?.destroy?.(); } catch {}
        cache.delete(idx);
        // keep endAt so virtual page mapping remains stable
      }
    }

    async function ensureEndAt(partIndex) {
      for (let i = 0; i <= partIndex; i++) {
        if (!endAt.has(i)) await loadPart(i);
      }
    }

    async function resolveVirtualPage(virtualPage) {
      if (virtualPage < 1) throw new Error("virtualPage < 1");
      for (let i = 0; i < urls.length; i++) {
        if (!urls[i]) continue; // allow gaps if not all parts were picked
        await ensureEndAt(i);
        const last = endAt.get(i);
        if (virtualPage <= last) {
          const { pdf } = await loadPart(i);
          const startAt = (i === 0 ? 1 : (endAt.get(i - 1) + 1));
          const pageNum = virtualPage - startAt + 1;
          return { pdf, pageNum, partIndex: i };
        }
      }
      throw new RangeError("Virtual page out of range");
    }

    async function renderToCanvas(canvas, virtualPage) {
      try {
        const { pdf, pageNum } = await resolveVirtualPage(virtualPage);
        const page = await pdf.getPage(pageNum);

        const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
        let viewport = page.getViewport({ scale: BASE_SCALE * dpr });

        const clamp = Math.min(1, MAX_CANVAS_W / viewport.width, MAX_CANVAS_H / viewport.height);
        if (clamp < 1) viewport = page.getViewport({ scale: viewport.scale * clamp });

        const w = Math.floor(viewport.width);
        const h = Math.floor(viewport.height);
        if (w <= 0 || h <= 0) return;

        if (canvas.width !== w)  canvas.width  = w;
        if (canvas.height !== h) canvas.height = h;

        const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
        if (!ctx) return;

        await page.render({ canvasContext: ctx, viewport }).promise;
      } catch (e) {
        const ctx = canvas.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        // swallow benign errors
      }
    }

    async function renderSpread() {
      await renderToCanvas(leftCanvas,  currentPage);
      await renderToCanvas(rightCanvas, currentPage + 1);
    }

    // --- Controls
    nextBtn.addEventListener("click", async () => {
      if (isBusy) return;
      isBusy = true;
      prevBtn.disabled = true; nextBtn.disabled = true;
      await new Promise(requestAnimationFrame);
      try {
        await resolveVirtualPage(currentPage + 2); // check if next spread exists
        currentPage += 2;
        await renderSpread();
      } finally {
        prevBtn.disabled = false; nextBtn.disabled = false;
        isBusy = false;
      }
    });

    prevBtn.addEventListener("click", async () => {
      if (isBusy || currentPage - 2 < 1) return;
      isBusy = true;
      prevBtn.disabled = true; nextBtn.disabled = true;
      await new Promise(requestAnimationFrame);
      try {
        currentPage -= 2;
        await renderSpread();
      } finally {
        prevBtn.disabled = false; nextBtn.disabled = false;
        isBusy = false;
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextBtn.click();
      else if (e.key === "ArrowLeft") prevBtn.click();
    });

    // --- Boot
    (async () => {
      const ok = await setupFileModeIfNeeded();
      if (!ok) return; // waiting for user to pick files
      try {
        await renderSpread();
      } catch (err) {
        console.error("Init error:", err);
        alert('Could not render. Ensure PDFs exist under ./pdfs/ or pick them when prompted.');
      }
    })();
  </script>
</body>
</html>
