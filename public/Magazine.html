<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Flipbook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .book {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      width: 45vw;
      height: auto;
      margin: 0 5px;
      box-shadow: 0 0 10px #444;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="book">
    <canvas id="leftPage"></canvas>
    <canvas id="rightPage"></canvas>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pdfDoc = null;
    let currentPage = 1;

    const leftCanvas = document.getElementById("leftPage");
    const rightCanvas = document.getElementById("rightPage");

    async function renderPage(canvas, pageNum) {
      if (pageNum > pdfDoc.numPages) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const page = await pdfDoc.getPage(pageNum);
      const desiredScale = 1.2; // adjust scale as needed
      const viewport = page.getViewport({ scale: desiredScale });

      const dpi = window.devicePixelRatio || 1;
      canvas.width = viewport.width * dpi;
      canvas.height = viewport.height * dpi;

      canvas.style.width = viewport.width + "px";
      canvas.style.height = viewport.height + "px";

      const context = canvas.getContext("2d");
      context.setTransform(dpi, 0, 0, dpi, 0, 0);

      await page.render({ canvasContext: context, viewport }).promise;
    }

    async function renderCurrentSpread() {
      await renderPage(leftCanvas, currentPage);
      await renderPage(rightCanvas, currentPage + 1);
    }

    function goNext() {
      if (currentPage + 2 <= pdfDoc.numPages) {
        currentPage += 2;
        renderCurrentSpread();
      }
    }

    function goPrev() {
      if (currentPage - 2 >= 1) {
        currentPage -= 2;
        renderCurrentSpread();
      }
    }

    window.onload = async () => {
      const url = "bb.pdf"; // PDF must be in same folder
      pdfDoc = await pdfjsLib.getDocument(url).promise;
      await renderCurrentSpread();
    };

    // ✅ Listen for messages from parent React app
    window.addEventListener("message", (e) => {
      const msg = e.data;
      if (!msg) return;
      if (msg === "next" || (msg.type === "flip" && msg.dir === "next")) goNext();
      if (msg === "prev" || (msg.type === "flip" && msg.dir === "prev")) goPrev();
    });
  </script>
</body>
</html>
