<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Flipbook (Lazy)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .book {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      width: 45vw;          /* responsive size handled by CSS */
      height: auto;
      margin: 0 5px;
      box-shadow: 0 0 10px #444;
      background: #000;
    }
    .nav-buttons {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }
    .nav-buttons button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 0 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="book">
    <canvas id="leftPage"></canvas>
    <canvas id="rightPage"></canvas>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn">⏪ Previous</button>
    <button id="nextBtn">Next ⏩</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    // List your split parts in order. Files should live at /public/pdfs/partXX.pdf
    const names = [
      'part01.pdf','part02.pdf','part03.pdf','part04.pdf','part05.pdf',
      'part06.pdf','part07.pdf','part08.pdf','part09.pdf','part10.pdf',
      'part11.pdf','part12.pdf','part13.pdf','part14.pdf','part15.pdf',
      'part16.pdf','part17.pdf','part18.pdf','part19.pdf','part20.pdf',
           'part21.pdf','part22.pdf','part23.pdf','part24.pdf','part25.pdf',
      'part26.pdf','part27.pdf','part28.pdf','part29.pdf','part30.pdf',
           'part31.pdf','part32.pdf','part33.pdf','part34.pdf','part35.pdf',
      'part36.pdf','part37.pdf','part38.pdf','part39.pdf'
    ];
    const urls = names.map(n => new URL(`pdfs/${n}`, document.baseURI).toString());

    // Lazy cache: partIndex -> { pdf, numPages }
    const cache = new Map();
    // Running totals we’ve already learned: partIndex -> endAt (virtual page)
    const endAt = new Map();  // e.g., endAt.get(0) = last virtual page inside part 0

    let currentPage = 1;

    const leftCanvas  = document.getElementById("leftPage");
    const rightCanvas = document.getElementById("rightPage");

    async function loadPart(partIndex) {
      if (cache.has(partIndex)) return cache.get(partIndex);

      const url = urls[partIndex];
      // Open this part (only when needed)
      const pdf = await pdfjsLib.getDocument({ url }).promise;
      const numPages = pdf.numPages;
      const entry = { pdf, numPages };
      cache.set(partIndex, entry);

      // Update endAt (cumulative virtual-page limit) for this and all following parts
      const prevEnd = partIndex === 0 ? 0 : endAt.get(partIndex - 1) ?? 0;
      endAt.set(partIndex, prevEnd + numPages);
      return entry;
    }

    // Ensure we know the cumulative endAt up to (and including) a given part
    async function ensureEndAt(partIndex) {
      // Walk from 0..partIndex and load any missing parts just enough to get numPages
      for (let i = 0; i <= partIndex; i++) {
        if (!endAt.has(i)) {
          await loadPart(i);
        }
      }
    }

    // Resolve a virtual page number to { pdf, pageNum, partIndex }
    async function resolveVirtualPage(virtualPage) {
      if (virtualPage < 1) throw new Error("virtualPage < 1");

      // Step through parts in order until the end covers this virtual page
      for (let i = 0; i < urls.length; i++) {
        await ensureEndAt(i);
        const last = endAt.get(i);
        if (virtualPage <= last) {
          const { pdf } = cache.get(i);
          const startAt = (i === 0 ? 1 : (endAt.get(i - 1) + 1));
          const pageNum = virtualPage - startAt + 1;
          return { pdf, pageNum, partIndex: i };
        }
      }

      // If we got here, virtualPage is beyond the whole book
      throw new RangeError("Virtual page out of range");
    }

    async function renderToCanvas(canvas, virtualPage) {
      try {
        const { pdf, pageNum } = await resolveVirtualPage(virtualPage);
        const page = await pdf.getPage(pageNum);

        const desiredScale = 1.5;
        const viewport = page.getViewport({ scale: desiredScale });

        const dpi = window.devicePixelRatio || 1;
        canvas.width  = Math.floor(viewport.width  * dpi);
        canvas.height = Math.floor(viewport.height * dpi);

        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpi, 0, 0, dpi, 0, 0);

        await page.render({ canvasContext: ctx, viewport }).promise;
      } catch (e) {
        // If the page is out of range, clear the canvas
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
// put these once near your other globals
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
let isBusy = false;

async function renderSpread() {
  // Left = currentPage, Right = currentPage + 1
  await renderToCanvas(leftCanvas, currentPage);
  await renderToCanvas(rightCanvas, currentPage + 1);
}

nextBtn.addEventListener("click", async () => {
  if (isBusy) return;
  isBusy = true;
  prevBtn.disabled = true; nextBtn.disabled = true;
  await new Promise(requestAnimationFrame); // paint disabled state

  try {
    await resolveVirtualPage(currentPage + 2);
    currentPage += 2;
    await renderSpread();
  } finally {
    prevBtn.disabled = false; nextBtn.disabled = false;
    isBusy = false;
  }
});

prevBtn.addEventListener("click", async () => {
  if (isBusy || currentPage - 2 < 1) return;
  isBusy = true;
  prevBtn.disabled = true; nextBtn.disabled = true;
  await new Promise(requestAnimationFrame);

  try {
    currentPage -= 2;
    await renderSpread();
  } finally {
    prevBtn.disabled = false; nextBtn.disabled = false;
    isBusy = false;
  }
});

    // Keyboard navigation (← / →)
    window.addEventListener("keydown", async (e) => {
      if (e.key === "ArrowRight") {
        document.getElementById("nextBtn").click();
      } else if (e.key === "ArrowLeft") {
        document.getElementById("prevBtn").click();
      }
    });

    // Initial render
    (async () => {
      try {
        await renderSpread();
      } catch (err) {
        console.error("Init error:", err);
        alert('Could not render. Check that /public/pdfs/part01.pdf exists and is accessible.');
      }
    })();
  </script>
</body>
</html>
