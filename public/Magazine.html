<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Flipbook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .book {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      width: 45vw;          /* responsive size handled by CSS */
      height: auto;
      margin: 0 5px;
      box-shadow: 0 0 10px #444;
      background: #000;
    }
    .nav-buttons {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .nav-buttons button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 0 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="book">
    <canvas id="leftPage"></canvas>
    <canvas id="rightPage"></canvas>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn">⏪ Previous</button>
    <button id="nextBtn">Next ⏩</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let pdfDoc = null;
    let currentPage = 1;

    const leftCanvas = document.getElementById("leftPage");
    const rightCanvas = document.getElementById("rightPage");

    const renderPage = async (canvas, pageNum) => {
      if (pageNum > pdfDoc.numPages) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const page = await pdfDoc.getPage(pageNum);
      const desiredScale = 1.5; // tweak for sharpness
      const viewport = page.getViewport({ scale: desiredScale });

      // Match canvas *buffer* to viewport * device pixel ratio; let CSS control layout
      const dpi = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * dpi);
      canvas.height = Math.floor(viewport.height * dpi);

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpi, 0, 0, dpi, 0, 0);

      await page.render({ canvasContext: ctx, viewport }).promise;
    };

    const renderCurrentSpread = async () => {
      await renderPage(leftCanvas, currentPage);
      await renderPage(rightCanvas, currentPage + 1);
    };

    document.getElementById("nextBtn").addEventListener("click", async () => {
      if (currentPage + 2 <= pdfDoc.numPages) {
        currentPage += 2;
        await renderCurrentSpread();
      }
    });

    document.getElementById("prevBtn").addEventListener("click", async () => {
      if (currentPage - 2 >= 1) {
        currentPage -= 2;
        await renderCurrentSpread();
      }
    });

    window.onload = async () => {
      try {
        const names = [
          'part01.pdf','part02.pdf','part03.pdf','part04.pdf','part05.pdf',
          'part06.pdf','part07.pdf','part08.pdf','part09.pdf','part10.pdf'
        ];

        // ✅ Single, absolute mapping; remove the earlier duplicate
       // Build URLs that work in Live Server (any subfolder) AND on Vercel
const urls = names.map(n => new URL(`pdfs/${n}`, document.baseURI).toString());

        // Load all PDFs
        const loaded = [];
        await Promise.all(
          urls.map(async (url) => {
            try {
              const pdf = await pdfjsLib.getDocument({ url }).promise;
              console.log(`✅ Loaded ${url}`);
              loaded.push({ pdf });
            } catch (e) {
              console.error(`❌ Failed to load ${url}`, e);
            }
          })
        );

        if (loaded.length === 0) {
          alert('No PDFs loaded. Open /pdfs/part01.pdf directly to confirm the path and deployment.');
          return;
        }

        // Build virtual index
        let startAt = 1;
        const index = [];
        for (const { pdf } of loaded) {
          const numPages = pdf.numPages;
          index.push({ startAt, endAt: startAt + numPages - 1, pdf });
          startAt += numPages;
        }
        const total = startAt - 1;

        // Virtual pdfDoc shim
        pdfDoc = {
          numPages: total,
          getPage: async (virtualPage) => {
            for (const e of index) {
              if (virtualPage >= e.startAt && virtualPage <= e.endAt) {
                const pageNum = virtualPage - e.startAt + 1;
                return e.pdf.getPage(pageNum);
              }
            }
            throw new Error(`Virtual page ${virtualPage} out of range 1..${total}`);
          }
        };

        await renderCurrentSpread();
      } catch (err) {
        console.error('❌ Unexpected error in onload', err);
      }
    };
  </script>
</body>
</html>
