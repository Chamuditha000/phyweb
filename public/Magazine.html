<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Flipbook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .book {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      width: 45vw;
      height: auto;
      margin: 0 5px;
      box-shadow: 0 0 10px #444;
    }
    .nav-buttons {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .nav-buttons button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 0 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="book">
    <canvas id="leftPage"></canvas>
    <canvas id="rightPage"></canvas>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn">⏪ Previous</button>
    <button id="nextBtn">Next ⏩</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;

    const leftCanvas = document.getElementById("leftPage");
    const rightCanvas = document.getElementById("rightPage");
const renderPage = async (canvas, pageNum) => {
  if (pageNum > pdfDoc.numPages) {
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }

  const page = await pdfDoc.getPage(pageNum);
  const desiredScale = 1; // 🔍 Increase this if needed (2.5–3.0 is very crisp)
  const viewport = page.getViewport({ scale: desiredScale });

  // Match canvas size to PDF page size × devicePixelRatio
  const dpi = window.devicePixelRatio || 1;
  canvas.width = viewport.width * dpi;
  canvas.height = viewport.height * dpi;

  canvas.style.width = viewport.width + 'px';
  canvas.style.height = viewport.height + 'px';

  const context = canvas.getContext("2d");
  context.setTransform(dpi, 0, 0, dpi, 0, 0); // Apply scaling to match pixel ratio

  await page.render({
    canvasContext: context,
    viewport: viewport
  }).promise;
};

    const renderCurrentSpread = async () => {
      await renderPage(leftCanvas, currentPage);
      await renderPage(rightCanvas, currentPage + 1);
    };

    document.getElementById("nextBtn").addEventListener("click", async () => {
      if (currentPage + 2 <= pdfDoc.numPages) {
        currentPage += 2;
        await renderCurrentSpread();
      }
    });

    document.getElementById("prevBtn").addEventListener("click", async () => {
      if (currentPage - 2 >= 1) {
        currentPage -= 2;
        await renderCurrentSpread();
      }
    });

    window.onload = async () => {
      const url = 'bb.pdf'; // Must be in same folder
      pdfDoc = await pdfjsLib.getDocument(url).promise;
      await renderCurrentSpread();
    };
  </script>
</body>
</html>
